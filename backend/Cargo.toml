[package]
name = "clyune-component"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Axum backend for Clyune Component Gallery (React SPA + Postgres)"
license = "MIT"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.43", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "trace", "cors"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
anyhow = "1.0.95"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "json", "macros"] }
chrono = { version = "0.4.39", features = ["serde"] }
dotenvy = "0.15.7"
